<svg viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a2a"/>
      <stop offset="60%" stop-color="#0f0818"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="squadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#FF4500"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="240" fill="url(#bg3)"/>
  <!-- Purple glow -->
  <ellipse cx="680" cy="100" rx="200" ry="140" fill="#6B21A8" opacity="0.08"/>
  <ellipse cx="400" cy="240" rx="300" ry="80" fill="#9B59B6" opacity="0.05"/>
  <!-- Diamond/square pattern -->
  <g opacity="0.07" stroke="#9B59B6" stroke-width="1" fill="none">
    <rect x="560" y="20" width="60" height="60" transform="rotate(45 590 50)"/>
    <rect x="620" y="60" width="60" height="60" transform="rotate(45 650 90)"/>
    <rect x="680" y="20" width="60" height="60" transform="rotate(45 710 50)"/>
    <rect x="740" y="60" width="60" height="60" transform="rotate(45 770 90)"/>
    <rect x="600" y="120" width="60" height="60" transform="rotate(45 630 150)"/>
    <rect x="660" y="150" width="60" height="60" transform="rotate(45 690 180)"/>
    <rect x="720" y="120" width="60" height="60" transform="rotate(45 750 150)"/>
  </g>
  <!-- Squad silhouettes (4 figures) -->
  <g transform="translate(560, 40)" filter="url(#glow3)" opacity="0.8">
    <!-- Figure 1 -->
    <g transform="translate(0, 0)" fill="#9B59B6" opacity="0.9">
      <circle cx="20" cy="20" r="12"/>
      <path d="M10 35 L8 90 L18 90 L20 65 L22 90 L32 90 L30 35 Z"/>
      <line x1="8" y1="50" x2="-5" y2="70" stroke="#9B59B6" stroke-width="5" stroke-linecap="round"/>
      <line x1="32" y1="50" x2="45" y2="70" stroke="#9B59B6" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- Figure 2 -->
    <g transform="translate(55, 0)" fill="#B06AD4" opacity="0.85">
      <circle cx="20" cy="20" r="12"/>
      <path d="M10 35 L8 90 L18 90 L20 65 L22 90 L32 90 L30 35 Z"/>
      <line x1="8" y1="50" x2="-5" y2="70" stroke="#B06AD4" stroke-width="5" stroke-linecap="round"/>
      <line x1="32" y1="50" x2="45" y2="70" stroke="#B06AD4" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- Figure 3 -->
    <g transform="translate(110, 0)" fill="#FF4500" opacity="0.85">
      <circle cx="20" cy="20" r="12"/>
      <path d="M10 35 L8 90 L18 90 L20 65 L22 90 L32 90 L30 35 Z"/>
      <line x1="8" y1="50" x2="-5" y2="70" stroke="#FF4500" stroke-width="5" stroke-linecap="round"/>
      <line x1="32" y1="50" x2="45" y2="70" stroke="#FF4500" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- Figure 4 -->
    <g transform="translate(165, 0)" fill="#FF6B35" opacity="0.8">
      <circle cx="20" cy="20" r="12"/>
      <path d="M10 35 L8 90 L18 90 L20 65 L22 90 L32 90 L30 35 Z"/>
      <line x1="8" y1="50" x2="-5" y2="70" stroke="#FF6B35" stroke-width="5" stroke-linecap="round"/>
      <line x1="32" y1="50" x2="45" y2="70" stroke="#FF6B35" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
  <!-- Crosshair on one figure -->
  <g transform="translate(625, 52)" opacity="0.6" stroke="#FF4500" stroke-width="1.5" fill="none">
    <circle cx="12" cy="12" r="10"/>
    <line x1="12" y1="0" x2="12" y2="5"/>
    <line x1="12" y1="19" x2="12" y2="24"/>
    <line x1="0" y1="12" x2="5" y2="12"/>
    <line x1="19" y1="12" x2="24" y2="12"/>
  </g>
  <!-- Accent lines -->
  <line x1="540" y1="0" x2="540" y2="240" stroke="#9B59B6" stroke-width="1" opacity="0.15"/>
  <line x1="0" y1="200" x2="540" y2="200" stroke="#9B59B6" stroke-width="0.5" opacity="0.1"/>
  <!-- Bottom accent -->
  <rect x="0" y="233" width="800" height="7" fill="url(#squadGrad)" opacity="0.35"/>
  <!-- Dots -->
  <circle cx="60" cy="40" r="2" fill="#9B59B6" opacity="0.4"/>
  <circle cx="100" cy="200" r="1.5" fill="#FF4500" opacity="0.35"/>
  <circle cx="480" cy="60" r="2" fill="#9B59B6" opacity="0.3"/>
</svg>
