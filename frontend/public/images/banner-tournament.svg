<svg viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a0a00"/>
      <stop offset="60%" stop-color="#1a0800"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="trophyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="240" fill="url(#bg1)"/>
  <!-- Hex grid pattern -->
  <g opacity="0.07" stroke="#FF4500" stroke-width="1" fill="none">
    <polygon points="680,40 720,20 760,40 760,80 720,100 680,80"/>
    <polygon points="720,100 760,80 800,100 800,140 760,160 720,140"/>
    <polygon points="640,120 680,100 720,120 720,160 680,180 640,160"/>
    <polygon points="680,200 720,180 760,200 760,240 720,260 680,240"/>
    <polygon points="740,0 780,0 800,20 800,0"/>
  </g>
  <!-- Orange glow blob -->
  <ellipse cx="650" cy="120" rx="180" ry="120" fill="#FF4500" opacity="0.06"/>
  <!-- Trophy icon (right side) -->
  <g transform="translate(560, 20)" opacity="0.85" filter="url(#glow1)">
    <!-- Cup body -->
    <path d="M80 20 L120 20 L115 90 Q100 110 80 100 Q60 110 45 90 L40 20 Z"
          fill="url(#trophyGrad)" opacity="0.9"/>
    <!-- Cup handles -->
    <path d="M40 30 Q20 30 20 55 Q20 75 40 75" fill="none" stroke="url(#trophyGrad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M120 30 Q140 30 140 55 Q140 75 120 75" fill="none" stroke="url(#trophyGrad)" stroke-width="8" stroke-linecap="round"/>
    <!-- Stem -->
    <rect x="72" y="100" width="16" height="30" fill="#CC8800" rx="2"/>
    <!-- Base -->
    <rect x="55" y="130" width="50" height="10" fill="#CC8800" rx="3"/>
    <!-- Star on cup -->
    <polygon points="80,40 83,50 93,50 85,56 88,66 80,60 72,66 75,56 67,50 77,50"
             fill="#FFF8DC" opacity="0.9"/>
  </g>
  <!-- Vertical accent lines -->
  <line x1="520" y1="0" x2="520" y2="240" stroke="#FF4500" stroke-width="1" opacity="0.2"/>
  <line x1="525" y1="0" x2="525" y2="240" stroke="#FF4500" stroke-width="0.5" opacity="0.1"/>
  <!-- Horizontal scan lines -->
  <line x1="0" y1="60" x2="520" y2="60" stroke="#FF4500" stroke-width="0.5" opacity="0.15"/>
  <line x1="0" y1="180" x2="520" y2="180" stroke="#FF4500" stroke-width="0.5" opacity="0.15"/>
  <!-- Bottom glow edge -->
  <rect x="0" y="230" width="800" height="10" fill="#FF4500" opacity="0.3"/>
  <!-- Small decorative dots -->
  <circle cx="50" cy="50" r="2" fill="#FF4500" opacity="0.4"/>
  <circle cx="80" cy="200" r="1.5" fill="#FFD700" opacity="0.4"/>
  <circle cx="120" cy="30" r="1" fill="#FF4500" opacity="0.3"/>
  <circle cx="450" cy="210" r="2" fill="#FFD700" opacity="0.3"/>
  <circle cx="480" cy="30" r="1.5" fill="#FF4500" opacity="0.3"/>
</svg>
